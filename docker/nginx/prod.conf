server {
    listen 80;

    # -----------------------------------------------------------------------
    # Game WebSocket connections  /games/{id}/ws
    # -----------------------------------------------------------------------
    location ~ ^/games/.+/ws$ {
        proxy_pass         http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # -----------------------------------------------------------------------
    # REST API — /docs and /redoc intentionally excluded in prod.
    # Remove that restriction if you want Swagger UI accessible.
    # -----------------------------------------------------------------------
    location ~ ^/games {
        proxy_pass         http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # -----------------------------------------------------------------------
    # React client — served as static files built into the image.
    # In prod the client Dockerfile should run `npm run build` and serve
    # from /app/dist. For now this proxies the dev server; swap for a
    # static root once a production client build is added.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass         http://client:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}

server {
    listen 80;

    # -----------------------------------------------------------------------
    # Game WebSocket connections  /games/{id}/ws
    # Must be matched before the generic /games block below.
    # WebSocket requires HTTP upgrade headers and a long read timeout.
    # -----------------------------------------------------------------------
    location ~ ^/games/.+/ws$ {
        proxy_pass         http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;   # keep connection open for the life of the session
    }

    # -----------------------------------------------------------------------
    # REST API  /games, /docs, /openapi.json, /redoc
    # -----------------------------------------------------------------------
    location ~ ^/(games|docs|openapi\.json|redoc) {
        proxy_pass         http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # -----------------------------------------------------------------------
    # React dev server + Vite HMR WebSocket
    # Vite's hot-module-reload uses a WebSocket at /@vite/client — the
    # Upgrade headers here handle that automatically.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass         http://client:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}

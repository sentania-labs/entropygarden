# Development — bind mounts, hot reload, data stored in ./local/ (gitignored)
#
# Server only (port 8000 + Swagger UI at :8000/docs):
#   docker compose up
#
# Server + client + proxy (everything through port 80):
#   docker compose --profile client up

services:
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    ports:
      - "8000:8000"     # exposed in dev for direct curl / Swagger UI access
    volumes:
      - ./server:/app/server        # source — live reload picks up changes
      - ./data:/app/data            # events.yaml and other seed data
      - ./local/db:/data            # SQLite — browse at ./local/db/entropy_garden.db
    environment:
      - ENTROPY_GARDEN_DB=/data/entropy_garden.db
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost}
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    ports:
      - "5173:5173"     # exposed in dev for direct access without proxy
    volumes:
      - ./client:/app
      - ./local/client_modules:/app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-}    # empty = same-origin when behind proxy
    depends_on:
      - server
    profiles:
      - client

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"         # single entry point for LAN access
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - client
    profiles:
      - client

# Development — bind mounts, hot reload, data stored in ./local/ (gitignored)
# Usage:
#   docker compose up                       # server only
#   docker compose --profile client up     # server + client

services:
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app/server        # source — live reload picks up changes
      - ./data:/app/data            # events.yaml and other seed data
      - ./local/db:/data            # SQLite — findable at ./local/db/
    environment:
      - ENTROPY_GARDEN_DB=/data/entropy_garden.db
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app                           # source — live reload
      - ./local/client_modules:/app/node_modules  # npm cache — findable at ./local/client_modules/
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - server
    profiles:
      - client

# Development — bind mounts, hot reload, data in ./local/ (gitignored)
#
# Server only (API on :8000, Swagger at :8000/docs):
#   docker compose up
#
# Server + client + HTTPS proxy (everything through :8443, HTTP :8080 redirects):
#   docker compose --profile client up
#
# Ports are configurable via .env:
#   HTTP_PORT=8080   (default)
#   HTTPS_PORT=8443  (default)
#   SSL_CN=localhost (CN for self-signed cert)

services:
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    ports:
      - "8000:8000"     # exposed in dev for direct curl / Swagger UI
    volumes:
      - ./server:/app/server
      - ./data:/app/data
      - ./local/db:/data
    environment:
      - ENTROPY_GARDEN_DB=/data/entropy_garden.db
      - CORS_ORIGINS=${CORS_ORIGINS:-*}   # permissive in dev; same-origin via proxy anyway
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    ports:
      - "5173:5173"     # exposed in dev for direct access
    volumes:
      - ./client:/app
      - ./local/client_modules:/app/node_modules
    environment:
      - VITE_API_URL=   # empty = same-origin when behind proxy
    depends_on:
      - server
    profiles:
      - client

  proxy:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    volumes:
      - ./docker/nginx/dev.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./local/ssl:/etc/nginx/ssl        # cert.pem + key.pem — auto-generated if absent
    environment:
      - HTTP_PORT=${HTTP_PORT:-8080}
      - HTTPS_PORT=${HTTPS_PORT:-8443}
      - SSL_CN=${SSL_CN:-localhost}
      - NGINX_TEMPLATE=/etc/nginx/templates/default.conf.template
    depends_on:
      - server
      - client
    profiles:
      - client

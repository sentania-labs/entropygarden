# Production — named volumes, no source mounts, no hot reload
# API port is NOT exposed — all traffic enters through nginx on port 80.
#
# Usage:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d

services:
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    # no ports: — server is internal only, not reachable outside Docker network
    volumes:
      - db_data:/data
    environment:
      - ENTROPY_GARDEN_DB=/data/entropy_garden.db
      - CORS_ORIGINS=*    # moot — same-origin via proxy, but left permissive as a safety net
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    # no ports: — client is internal only
    environment:
      - VITE_API_URL=    # empty = same-origin, all API calls go through proxy
    depends_on:
      - server
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"           # only port exposed to the outside world
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - client
    restart: unless-stopped

volumes:
  db_data:
